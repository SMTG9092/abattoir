<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Magasins - SMTG</title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            color: #1f2937;
        }


        /* =====================================================
           PAGE
        ====================================================== */

        .page-container {

            width: 100%;

            max-width: 1600px;

            margin: 0 auto;

            padding: 20px;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .page-header {

            background: #ffffff;

            border-radius: 14px;

            padding: 16px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 15px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.05);
        }


        .page-title {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .page-title-icon {

            width: 44px;

            height: 44px;

            border-radius: 10px;

            background: #145a1f;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 19px;
        }


        .page-title h1 {

            margin: 0;

            font-size: 20px;

            color: #1f2937;
        }


        .page-title p {

            margin: 3px 0 0;

            font-size: 11px;

            color: #7b8490;
        }


        /* =====================================================
           BUTTONS
        ====================================================== */

        .btn {

            border: none;

            border-radius: 8px;

            padding: 9px 13px;

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            font-size: 12px;

            font-weight: 600;

            transition: .2s;
        }


        .btn:hover {

            transform:
                translateY(-1px);
        }


        .btn:disabled {

            opacity: .55;

            cursor: not-allowed;

            transform: none;
        }


        .btn-primary {

            background: #145a1f;

            color: white;
        }


        .btn-primary:hover {

            background: #0d4316;
        }


        .btn-secondary {

            background: #eef1f4;

            color: #374151;
        }


        .btn-secondary:hover {

            background: #e2e6ea;
        }


        .btn-warning {

            background: #f59e0b;

            color: white;
        }


        .btn-danger {

            background: #dc2626;

            color: white;
        }


        .btn-sm {

            padding: 6px 9px;

            font-size: 11px;
        }


        /* =====================================================
           STATS
        ====================================================== */

        .stats-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 15px;
        }


        .stat-card {

            background: white;

            border-radius: 11px;

            padding: 13px;

            display: flex;

            align-items: center;

            gap: 11px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,.04);
        }


        .stat-icon {

            width: 38px;

            height: 38px;

            border-radius: 9px;

            background: #eaf5ec;

            color: #145a1f;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 15px;
        }


        .stat-value {

            font-size: 18px;

            font-weight: 700;

            line-height: 1;
        }


        .stat-label {

            margin-top: 4px;

            font-size: 9px;

            color: #7b8490;
        }


        /* =====================================================
           FILTERS
        ====================================================== */

        .filters-card {

            background: white;

            border-radius: 11px;

            padding: 13px;

            margin-bottom: 15px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,.04);
        }


        .filters {

            display: grid;

            grid-template-columns:
                2fr
                1fr
                1fr
                auto;

            gap: 10px;

            align-items: end;
        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        .form-group label {

            font-size: 10px;

            font-weight: 700;

            color: #374151;
        }


        input,
        select,
        textarea {

            width: 100%;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            padding: 9px 10px;

            background: white;

            outline: none;

            font-family: inherit;

            font-size: 12px;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #145a1f;

            box-shadow:
                0 0 0 3px
                rgba(20,90,31,.08);
        }


        textarea {

            resize: vertical;
        }


        /* =====================================================
           TABLE
        ====================================================== */

        .table-card {

            background: white;

            border-radius: 11px;

            overflow: hidden;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,.04);
        }


        .table-header {

            padding: 12px 14px;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .table-header h2 {

            margin: 0;

            font-size: 13px;

            color: #374151;
        }


        .table-wrapper {

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1050px;
        }


        th {

            padding: 10px;

            background: #f8faf9;

            border-bottom:
                1px solid #e5e7eb;

            text-align: left;

            white-space: nowrap;

            font-size: 9px;

            color: #4b5563;

            text-transform: uppercase;
        }


        td {

            padding: 10px;

            border-bottom:
                1px solid #edf0f2;

            font-size: 11px;

            vertical-align: middle;
        }


        tr:hover td {

            background: #fafdfb;
        }


        .code {

            color: #145a1f;

            font-weight: 700;
        }


        .division-badge {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 4px 7px;

            border-radius: 6px;

            background: #edf7ef;

            color: #145a1f;

            font-weight: 700;

            font-size: 9px;

            white-space: nowrap;
        }


        .no-division {

            color: #9ca3af;

            font-size: 10px;

            font-style: italic;
        }


        .status {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 4px 8px;

            border-radius: 20px;

            font-size: 9px;

            font-weight: 700;
        }


        .status.active {

            background: #dcfce7;

            color: #166534;
        }


        .status.inactive {

            background: #fee2e2;

            color: #991b1b;
        }


        .actions {

            display: flex;

            gap: 5px;
        }


        .empty {

            text-align: center;

            padding: 40px 20px;

            color: #9ca3af;
        }


        .empty i {

            font-size: 30px;

            margin-bottom: 8px;
        }


        .loading {

            text-align: center;

            padding: 35px;

            color: #6b7280;

            font-size: 12px;
        }


        /* =====================================================
           MODAL
        ====================================================== */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.45);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 9999;
        }


        .modal-overlay.show {

            display: flex;
        }


        .modal {

            width: 100%;

            max-width: 650px;

            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.25);
        }


        .modal-header {

            padding: 15px 19px;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .modal-header h2 {

            margin: 0;

            font-size: 16px;
        }


        .modal-close {

            width: 32px;

            height: 32px;

            border: none;

            border-radius: 7px;

            background: #f3f4f6;

            cursor: pointer;
        }


        .modal-body {

            padding: 19px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        .full {

            grid-column:
                1 / -1;
        }


        .modal-footer {

            padding: 13px 19px;

            border-top:
                1px solid #e5e7eb;

            display: flex;

            justify-content: flex-end;

            gap: 8px;
        }


        /* =====================================================
           TOAST
        ====================================================== */

        .toast-container {

            position: fixed;

            top: 18px;

            right: 18px;

            z-index: 20000;

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .toast {

            min-width: 260px;

            max-width: 400px;

            background: white;

            padding: 11px 13px;

            border-radius: 8px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.15);

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 12px;
        }


        .toast.success {

            border-left:
                4px solid #16a34a;
        }


        .toast.error {

            border-left:
                4px solid #dc2626;
        }


        .toast.warning {

            border-left:
                4px solid #f59e0b;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 1000px) {

            .stats-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .filters {

                grid-template-columns:
                    1fr 1fr;
            }
        }


        @media (max-width: 650px) {

            .page-container {

                padding: 10px;
            }


            .page-header {

                flex-direction: column;

                align-items: flex-start;
            }


            .stats-grid {

                grid-template-columns: 1fr;
            }


            .filters {

                grid-template-columns: 1fr;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .full {

                grid-column: auto;
            }
        }

    </style>

</head>


<body>


<div class="page-container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="page-header">

        <div class="page-title">

            <div class="page-title-icon">

                <i class="fa-solid fa-warehouse"></i>

            </div>


            <div>

                <h1>
                    Magasins
                </h1>

                <p>
                    Gestion des magasins par division
                </p>

            </div>

        </div>


        <button
            type="button"
            class="btn btn-primary"
            id="btnNew"
            onclick="openCreateModal()"
        >

            <i class="fa-solid fa-plus"></i>

            Nouveau magasin

        </button>

    </div>


    <!-- =====================================================
         STATS
    ====================================================== -->

    <div class="stats-grid">


        <div class="stat-card">

            <div class="stat-icon">

                <i class="fa-solid fa-warehouse"></i>

            </div>


            <div>

                <div
                    class="stat-value"
                    id="statTotal"
                >
                    0
                </div>

                <div class="stat-label">
                    Total magasins
                </div>

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">

                <i class="fa-solid fa-circle-check"></i>

            </div>


            <div>

                <div
                    class="stat-value"
                    id="statActive"
                >
                    0
                </div>

                <div class="stat-label">
                    Magasins actifs
                </div>

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">

                <i class="fa-solid fa-circle-xmark"></i>

            </div>


            <div>

                <div
                    class="stat-value"
                    id="statInactive"
                >
                    0
                </div>

                <div class="stat-label">
                    Magasins inactifs
                </div>

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">

                <i class="fa-solid fa-code-branch"></i>

            </div>


            <div>

                <div
                    class="stat-value"
                    id="statDivisions"
                >
                    0
                </div>

                <div class="stat-label">
                    Divisions utilisées
                </div>

            </div>

        </div>


    </div>


    <!-- =====================================================
         FILTERS
    ====================================================== -->

    <div class="filters-card">

        <div class="filters">


            <div class="form-group">

                <label>
                    Recherche
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Code, nom, description..."
                >

            </div>



            <div class="form-group">

                <label>
                    Division
                </label>

                <select id="divisionFilter">

                    <option value="">
                        Toutes les divisions
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label>
                    Statut
                </label>

                <select id="statusFilter">

                    <option value="">
                        Tous
                    </option>

                    <option value="true">
                        Actif
                    </option>

                    <option value="false">
                        Inactif
                    </option>

                </select>

            </div>



            <button
                type="button"
                class="btn btn-secondary"
                id="btnReset"
            >

                <i class="fa-solid fa-rotate-left"></i>

                Réinitialiser

            </button>


        </div>

    </div>


    <!-- =====================================================
         TABLE
    ====================================================== -->

    <div class="table-card">


        <div class="table-header">

            <h2>

                <i class="fa-solid fa-list"></i>

                Liste des magasins

            </h2>


            <button
                type="button"
                class="btn btn-secondary btn-sm"
                id="btnRefresh"
            >

                <i class="fa-solid fa-arrows-rotate"></i>

                Actualiser

            </button>

        </div>



        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Code
                        </th>

                        <th>
                            Nom
                        </th>

                        <th>
                            Division
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Emplacements
                        </th>

                        <th>
                            Max palettes
                        </th>

                        <th>
                            Max tonnage KG
                        </th>

                        <th>
                            Statut
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                    <tr>

                        <td colspan="10">

                            <div class="loading">

                                <i
                                    class="fa-solid fa-spinner fa-spin"
                                ></i>

                                Chargement...

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>



<!-- =====================================================
     MODAL
====================================================== -->

<div
    class="modal-overlay"
    id="modalOverlay"
>


    <div class="modal">


        <div class="modal-header">

            <h2 id="modalTitle">
                Nouveau magasin
            </h2>


            <button
                type="button"
                class="modal-close"
                id="btnCloseModal"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>



        <form id="magasinForm">


            <div class="modal-body">


                <input
                    type="hidden"
                    id="magasinId"

                    <div class="form-group">

                        <label>

                            type="text"

                    <!-- NOM -->

                            Nom *

                            type="text"
                            id="name"

                            placeholder="Ex : FAR"
                        >

                    </div>


                    <!-- DIVISION -->

                    <div class="form-group">

                        <label>
                            Division
                        </label>

                        <select id="divisionId">

                            <option value="">

                        </select>

                    </div>


                    <!-- TYPE -->

                    <div class="form-group">

                        <label>
                            Type
                        </label>

                        <input
                            type="text"
                            id="type"
                            maxlength="100"
                            placeholder="Ex : Chambre"
                        >

                    </div>


                    <!-- MAX PALETTES -->

                    <div class="form-group">

                        <label>
                            Max palettes
                        </label>

                        <input
                            type="number"
                            id="maxPalettes"
                            min="0"
                            step="1"

                    </div>


                    <!-- MAX TONNAGE -->

                    <div class="form-group">

                        <label>
                            Max tonnage KG
                        </label>

                        <input
                            type="number"
                            id="maxTonnage"
                            min="0"

                        <select id="isActive">

                            id="description"

            <div class="modal-footer">

</div>

     TOAST
====================================================== -->

    class="toast-container"

<!-- =====================================================
     PAGE JAVASCRIPT
====================================================== -->

<script>

"use strict";


/* =========================================================
   VARIABLES
========================================================= */

let db = null;

let allMagasins = [];

let allDivisions = [];

let filteredMagasins = [];

let currentUser = null;


/* =========================================================
   DOM READY
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    initPage
);


/* =========================================================
   INIT
========================================================= */

async function initPage() {

    try {

        /* -----------------------------------------------
           Vérifier Supabase JS
        ------------------------------------------------ */

        if (
            typeof window.supabase ===
            "undefined"
        ) {

            throw new Error(
                "Supabase JS v2 n'est pas chargé."
            );

        }


        /* -----------------------------------------------
           Vérifier client SMTG
        ------------------------------------------------ */

        db =
            window.smtgSupabase;


        if (!db) {

            throw new Error(
                "Le client SMTG Supabase n'est pas initialisé."
            );

        }


        /* -----------------------------------------------
           Current user
        ------------------------------------------------ */

        currentUser =
            getCurrentUser();


        /* -----------------------------------------------
           Events
        ------------------------------------------------ */

        setupEvents();


        /* -----------------------------------------------
           Load divisions
        ------------------------------------------------ */

        await loadDivisions();


        /* -----------------------------------------------
           Load magasins
        ------------------------------------------------ */

        await loadMagasins();


    }
    catch (error) {

        console.error(
            "INIT MAGASINS:",
            error
        );


        showToast(
            error.message ||
            "Erreur de chargement.",
            "error"
        );


        showTableError(
            error.message
        );

    }

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {


    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            applyFilters
        );


    document
        .getElementById("divisionFilter")
        .addEventListener(
            "change",
            applyFilters
        );


    document
        .getElementById("statusFilter")
        .addEventListener(
            "change",
            applyFilters
        );


    document
        .getElementById("btnReset")
        .addEventListener(
            "click",
            resetFilters
        );


    document
        .getElementById("btnRefresh")
        .addEventListener(
            "click",
            async function () {

                await loadDivisions();

                await loadMagasins();

            }
        );


    document
        .getElementById("btnCloseModal")
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById("btnCancel")
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById("magasinForm")
        .addEventListener(
            "submit",
            saveMagasin
        );


    document
        .getElementById("modalOverlay")
        .addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    this
                ) {

                    closeModal();

                }

            }
        );


    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key ===
                "Escape"
            ) {

                closeModal();

            }

        }
    );

}


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser() {

    try {

        if (
            window.SMTG &&
            typeof window.SMTG.getCurrentUser ===
            "function"
        ) {

            const user =
                window.SMTG.getCurrentUser();

            if (user) {

                return user;

            }

        }


        const sessionUser =
            sessionStorage.getItem(
                "smtg_current_user"
            );


        if (sessionUser) {

            return JSON.parse(
                sessionUser
            );

        }


        const localUser =
            localStorage.getItem(
                "smtg_current_user"
            );


        if (localUser) {

            return JSON.parse(
                localUser
            );

        }


        const oldUser =
            sessionStorage.getItem(
                "smtgUser"
            );


        if (oldUser) {

            return JSON.parse(
                oldUser
            );

        }

    }
    catch (error) {

        console.warn(
            "GET CURRENT USER:",
            error
        );

    }


    return null;

}


/* =========================================================
   CURRENT USER ID
========================================================= */

function getCurrentUserId() {

    const user =
        currentUser ||
        getCurrentUser();


    if (
        user &&
        user.id !== null &&
        user.id !== undefined
    ) {

        return Number(
            user.id
        );

    }


    /*
     * Fallback technique SYSTEM.
     */

    return 1;

}

   LOAD MAGASINS
========================================================= */

async function loadMagasins() {

    if (!db) {

        throw new Error(
            "Client Supabase indisponible."
        );

    }


    showTableLoading();


    try {

        const {
            data,
            error
        } = await db
            .from("magasins")
            .select(`
                id,
                code,
                name,
                description,
                type,
                has_emplacements,
                max_palettes,
                max_tonnage_kg,
                is_active,
                division_id,
                created_by,
                created_at,
                updated_by,
                updated_at
            `)
            .order(
                "code",
                {
                    ascending: true
                }
            );


        if (error) {

            throw error;

        }


        allMagasins =
            data || [];


        updateStats();


        applyFilters();

    }
    catch (error) {

        console.error(
            "LOAD MAGASINS:",
            error
        );


        showTableError(
            error.message
        );


        showToast(
            "Impossible de charger les magasins.",
            "error"
        );

    }

}


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters() {

    const search =
        (
            document.getElementById(
                "searchInput"
            ).value || ""
        )
        .trim()
        .toLowerCase();


    const divisionId =
        document.getElementById(
            "divisionFilter"
        ).value;


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    filteredMagasins =
        allMagasins.filter(
            function (magasin) {


                let matchSearch =
                    true;


                let matchDivision =
                    true;


                let matchStatus =
                    true;


                /* ---------------------------------------
                   SEARCH
                --------------------------------------- */

                if (search) {

                    const division =
                        getDivision(
                            magasin.division_id
                        );


                    const content = [

                        magasin.code,

                        magasin.name,

                        magasin.description,

                        magasin.type,

                        division?.code,

                        division?.name

                    ]
                    .filter(
                        value =>
                            value !==
                            null &&
                            value !==
                            undefined
                    )
                    .join(" ")
                    .toLowerCase();


                    matchSearch =
                        content.includes(
                            search
                        );

                }


                /* ---------------------------------------
                   DIVISION
                --------------------------------------- */

                if (
                    divisionId !== ""
                ) {

                    matchDivision =
                        String(
                            magasin.division_id
                        ) ===
                        String(
                            divisionId
                        );

                }


                /* ---------------------------------------
                   STATUS
                --------------------------------------- */

                if (
                    status !== ""
                ) {

                    matchStatus =
                        String(
                            magasin.is_active
                        ) ===
                        String(
                            status
                        );

                }


                return (
                    matchSearch &&
                    matchDivision &&
                    matchStatus
                );

            }
        );


    renderTable();

}


/* =========================================================
   RESET
========================================================= */

function resetFilters() {

    document.getElementById(
        "searchInput"
    ).value = "";


    document.getElementById(
        "divisionFilter"
    ).value = "";


    document.getElementById(
        "statusFilter"
    ).value = "";


    applyFilters();

}


/* =========================================================
   GET DIVISION
========================================================= */

function getDivision(
    divisionId
) {

    if (
        divisionId ===
        null ||
        divisionId ===
        undefined
    ) {

        return null;

    }


    return allDivisions.find(
        function (division) {

            return Number(
                division.id
            ) === Number(
                divisionId
            );

        }
    ) || null;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    const tbody =
        document.getElementById(
            "tableBody"
        );


    if (!tbody) {

        return;

    }


    if (
        filteredMagasins.length ===
        0
    ) {

        tbody.innerHTML = `

            <tr>

                <td colspan="10">

                    <div class="empty">

                        <i
                            class="fa-solid fa-warehouse"
                        ></i>

                        <div>
                            Aucun magasin trouvé.
                        </div>

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    tbody.innerHTML =
        filteredMagasins
        .map(
            function (magasin) {


                const division =
                    getDivision(
                        magasin.division_id
                    );


                const statusClass =
                    magasin.is_active
                        ? "active"
                        : "inactive";


                const statusText =
                    magasin.is_active
                        ? "Actif"
                        : "Inactif";


                const statusIcon =
                    magasin.is_active
                        ? "fa-check"
                        : "fa-xmark";


                return `

                    <tr>

                        <td>
                            ${escapeHtml(
                                magasin.id
                            )}
                        </td>


                        <td>

                            <span class="code">

                                ${escapeHtml(
                                    magasin.code ||
                                    ""
                                )}

                            </span>

                        </td>


                        <td>

                            ${escapeHtml(
                                magasin.name ||
                                ""
                            )}

                        </td>


                        <td>

                            ${
                                division

                                ?

                                `

                                    <span
                                        class="division-badge"
                                    >

                                        <i
                                            class="fa-solid fa-code-branch"
                                        ></i>

                                        ${escapeHtml(
                                            division.code
                                        )}

                                        -

                                        ${escapeHtml(
                                            division.name
                                        )}

                                    </span>

                                `

                                :

                                `

                                    <span
                                        class="no-division"
                                    >
                                        Non affecté
                                    </span>

                                `
                            }

                        </td>


                        <td>

                            ${escapeHtml(
                                magasin.type ||
                                "-"
                            )}

                        </td>


                        <td>

                            ${
                                magasin.has_emplacements
                                    ? "Oui"
                                    : "Non"
                            }

                        </td>


                        <td>

                            ${formatNumber(
                                magasin.max_palettes
                            )}

                        </td>


                        <td>

                            ${formatKg(
                                magasin.max_tonnage_kg
                            )}

                        </td>


                        <td>

                            <span
                                class="status ${statusClass}"
                            >

                                <i
                                    class="
                                        fa-solid
                                        ${statusIcon}
                                    "
                                ></i>

                                ${statusText}

                            </span>

                        </td>


                        <td>

                            <div class="actions">


                                <button
                                    type="button"
                                    class="btn btn-warning btn-sm"
                                    onclick="openEditModal(${Number(magasin.id)})"
                                    title="Modifier"
                                >

                                    <i
                                        class="fa-solid fa-pen"
                                    ></i>

                                </button>


                                <button
                                    type="button"
                                    class="btn btn-danger btn-sm"
                                    onclick="deleteMagasin(${Number(magasin.id)})"
                                    title="Supprimer"
                                >

                                    <i
                                        class="fa-solid fa-trash"
                                    ></i>

                                </button>


                            </div>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    const total =
        allMagasins.length;


    const active =
        allMagasins.filter(
            function (m) {

                return m.is_active;

            }
        ).length;


    const inactive =
        allMagasins.filter(
            function (m) {

                return !m.is_active;

            }
        ).length;


    const divisions =
        new Set(
            allMagasins
                .map(
                    function (m) {

                        return m.division_id;

                    }
                )
                .filter(
                    function (id) {

                        return (
                            id !==
                            null &&
                            id !==
                            undefined
                        );

                    }
                )
        ).size;


    document.getElementById(
        "statTotal"
    ).textContent =
        total;


    document.getElementById(
        "statActive"
    ).textContent =
        active;


    document.getElementById(
        "statInactive"
    ).textContent =
        inactive;


    document.getElementById(
        "statDivisions"
    ).textContent =
        divisions;

}

/* =========================================================
   SAVE
========================================================= */

async function saveMagasin(
    event
) {

    event.preventDefault();


    if (!db) {

        showToast(
            "Connexion Supabase indisponible.",
            "error"
        );

        return;

    }


    const id =
        document.getElementById(
            "magasinId"
        ).value;


    const code =
        document.getElementById(
            "code"
        ).value
        .trim();


    const name =
        document.getElementById(
            "name"
        ).value
        .trim();


    const divisionValue =
        document.getElementById(
            "divisionId"
        ).value;


    const type =
        document.getElementById(
            "type"
        ).value
        .trim();


    const maxPalettes =
        Number(
            document.getElementById(
                "maxPalettes"
            ).value ||
            0
        );


    const maxTonnage =
        Number(
            document.getElementById(
                "maxTonnage"
            ).value ||
            0
        );


    const hasEmplacements =
        document.getElementById(
            "hasEmplacements"
        ).value ===
        "true";


    const isActive =
        document.getElementById(
            "isActive"
        ).value ===
        "true";


    const description =
        document.getElementById(
            "description"
        ).value
        .trim();


    /* -----------------------------------------------
       VALIDATION
    ------------------------------------------------ */

    if (!code) {

        showToast(
            "Le code est obligatoire.",
            "warning"
        );

        return;

    }


    if (!name) {

        showToast(
            "Le nom est obligatoire.",
            "warning"
        );

        return;

    }


    if (
        !Number.isFinite(
            maxPalettes
        ) ||
        maxPalettes < 0
    ) {

        showToast(
            "Max palettes invalide.",
            "warning"
        );

        return;

    }


    if (
        !Number.isFinite(
            maxTonnage
        ) ||
        maxTonnage < 0
    ) {

        showToast(
            "Max tonnage invalide.",
            "warning"
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;


    saveButton.innerHTML = `

        <i
            class="fa-solid fa-spinner fa-spin"
        ></i>

        Enregistrement...

    `;


    try {


        const divisionId =
            divisionValue
                ? Number(
                    divisionValue
                )
                : null;


        const userId =
            getCurrentUserId();


        const payload = {

            code:
                code,

            name:
                name,

            description:
                description ||
                null,

            type:
                type ||
                null,

            has_emplacements:
                hasEmplacements,

            max_palettes:
                maxPalettes,

            max_tonnage_kg:
                maxTonnage,

            is_active:
                isActive,

            division_id:
                divisionId

        };


        /* =================================================
           UPDATE
        ================================================= */

        if (id) {


            payload.updated_by =
                userId;


            const {
                data,
                error
            } = await db
                .from("magasins")
                .update(
                    payload
                )
                .eq(
                    "id",
                    Number(id)
                )
                .select()
                .single();


            if (error) {

                throw error;

            }


            /* -------------------------------------------
               ACTIVITY LOG
            ------------------------------------------- */

            await writeCrudLog(
                "UPDATE",
                data.id,
                "Modification du magasin",
                {

                    code:
                        data.code,

                    name:
                        data.name,

                    division_id:
                        data.division_id

                }
            );


            showToast(
                "Magasin modifié avec succès.",
                "success"
            );

        }


        /* =================================================
           INSERT
        ================================================= */

        else {


            payload.created_by =
                userId;


            payload.updated_by =
                userId;


            const {
                data,
                error
            } = await db
                .from("magasins")
                .insert(
                    payload
                )
                .select()
                .single();


            if (error) {

                throw error;

            }


            /* -------------------------------------------
               ACTIVITY LOG
            ------------------------------------------- */

            await writeCrudLog(
                "CREATE",
                data.id,
                "Création du magasin",
                {

                    code:
                        data.code,

                    name:
                        data.name,

                    division_id:
                        data.division_id

                }
            );


            showToast(
                "Magasin créé avec succès.",
                "success"
            );

        }


        closeModal();


        await loadMagasins();


    }
    catch (error) {


        console.error(
            "SAVE MAGASIN:",
            error
        );


        if (
            error &&
            error.code ===
            "23505"
        ) {

            showToast(
                "Ce code magasin existe déjà.",
                "error"
            );

        }
        else if (
            error &&
            error.code ===
            "23503"
        ) {

            showToast(
                "La division sélectionnée n'existe pas.",
                "error"
            );

        }
        else {

            showToast(
                error?.message ||
                "Erreur lors de l'enregistrement.",
                "error"
            );

        }

    }
    finally {


        saveButton.disabled =
            false;


        saveButton.innerHTML = `

            <i
                class="fa-solid fa-floppy-disk"
            ></i>

            Enregistrer

        `;

    }

}


/* =========================================================
   DELETE
========================================================= */

async function deleteMagasin(
    id
) {

    if (!db) {

        showToast(
            "Connexion Supabase indisponible.",
            "error"
        );

        return;

    }


    const magasin =
        allMagasins.find(
            function (item) {

                return Number(
                    item.id
                ) === Number(
                    id
                );

            }
        );


    if (!magasin) {

        showToast(
            "Magasin introuvable.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            `Voulez-vous vraiment supprimer le magasin "${magasin.code} - ${magasin.name}" ?`
        );


    if (!confirmed) {

        return;

    }


    try {


        const {
            error
        } = await db
            .from("magasins")
            .delete()
            .eq(
                "id",
                Number(id)
            );


        if (error) {

            throw error;

        }


        await writeCrudLog(
            "DELETE",
            magasin.id,
            "Suppression du magasin",
            {

                code:
                    magasin.code,

                name:
                    magasin.name,

                division_id:
                    magasin.division_id

            }
        );


        showToast(
            "Magasin supprimé avec succès.",
            "success"
        );


        await loadMagasins();


    }
    catch (error) {


        console.error(
            "DELETE MAGASIN:",
            error
        );


        if (
            error &&
            error.code ===
            "23503"
        ) {

            showToast(
                "Impossible de supprimer ce magasin car il est utilisé par d'autres données.",
                "error"
            );

        }
        else {

            showToast(
                error?.message ||
                "Impossible de supprimer le magasin.",
                "error"
            );

        }

    }

}

) {

/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(
    value
) {

    const number =
        Number(
            value ||
            0
        );


    return number.toLocaleString(
        "fr-FR",
        {

            maximumFractionDigits:
                0

        }
    );

}


/* =========================================================
   FORMAT KG
========================================================= */

function formatKg(
    value
) {

    const number =
        Number(
            value ||
            0
        );


    return number.toLocaleString(
        "fr-FR",
        {

            minimumFractionDigits:
                3,

            maximumFractionDigits:
                3

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = "success"
) {

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type}`;


    let icon =
        "fa-circle-check";


    if (
        type ===
        "error"
    ) {

        icon =
            "fa-circle-xmark";

    }


    if (
        type ===
        "warning"
    ) {

        icon =
            "fa-triangle-exclamation";

    }


    toast.innerHTML = `

        <i
            class="fa-solid ${icon}"
        ></i>

        <span>
            ${escapeHtml(
                message
            )}
        </span>

    `;


    container.appendChild(
        toast
    );


    setTimeout(
        function () {

            toast.remove();

        },
        4000
    );

}

</script>
