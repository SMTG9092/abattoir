<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Magasins - SMTG</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .page-container {
            padding: 24px;
            max-width: 1600px;
            margin: auto;
        }

        /* =========================
           HEADER
        ========================= */

        .page-header {
            background: white;
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .page-title-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #145a1f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 23px;
        }

        .page-title p {
            margin: 4px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #145a1f;
            color: white;
        }

        .btn-primary:hover {
            background: #0e4316;
        }

        .btn-secondary {
            background: #eef1f4;
            color: #374151;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-sm {
            padding: 7px 10px;
            font-size: 12px;
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 13px;
            padding: 18px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            width: 45px;
            height: 45px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9f5eb;
            color: #145a1f;
            font-size: 19px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 3px;
        }

        /* =========================
           FILTERS
        ========================= */

        .filters-card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #145a1f;
            box-shadow: 0 0 0 3px rgba(20,90,31,.08);
        }

        /* =========================
           TABLE
        ========================= */

        .table-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .table-header {
            padding: 16px 18px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            margin: 0;
            font-size: 16px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #f8faf9;
            color: #374151;
            font-size: 12px;
            text-transform: uppercase;
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #edf0f2;
            font-size: 13px;
            vertical-align: middle;
        }

        tr:hover td {
            background: #fafdfb;
        }

        .code {
            font-weight: 700;
            color: #145a1f;
        }

        .division-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 7px;
            background: #edf7ef;
            color: #145a1f;
            font-weight: 700;
            font-size: 12px;
        }

        .no-division {
            color: #9ca3af;
            font-style: italic;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .empty {
            text-align: center;
            padding: 45px 20px;
            color: #9ca3af;
        }

        .empty i {
            font-size: 35px;
            margin-bottom: 10px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
            overflow: hidden;
        }

        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: none;
            background: #f3f4f6;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
        }

        .modal-body {
            padding: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .modal-footer {
            padding: 16px 22px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 35px;
            color: #6b7280;
        }

        .loading i {
            margin-right: 7px;
        }

        /* =========================
           TOAST
        ========================= */

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 280px;
            max-width: 420px;
            padding: 13px 16px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            animation: toastIn .25s ease;
        }

        .toast.success {
            border-left: 4px solid #16a34a;
        }

        .toast.error {
            border-left: 4px solid #dc2626;
        }

        .toast.warning {
            border-left: 4px solid #f59e0b;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 650px) {
            .page-container {
                padding: 12px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="page-container">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="page-header">

        <div class="page-title">

            <div class="page-title-icon">
                <i class="fa-solid fa-warehouse"></i>
            </div>

            <div>
                <h1>Magasins</h1>
                <p>Gestion des magasins par division</p>
            </div>

        </div>

        <button class="btn btn-primary" onclick="openCreateModal()">
            <i class="fa-solid fa-plus"></i>
            Nouveau magasin
        </button>

    </div>


    <!-- =========================
         STATS
    ========================= -->

    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-warehouse"></i>
            </div>

            <div>
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total magasins</div>
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <div>
                <div class="stat-value" id="statActive">0</div>
                <div class="stat-label">Magasins actifs</div>
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-circle-xmark"></i>
            </div>

            <div>
                <div class="stat-value" id="statInactive">0</div>
                <div class="stat-label">Magasins inactifs</div>
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-code-branch"></i>
            </div>

            <div>
                <div class="stat-value" id="statDivisions">0</div>
                <div class="stat-label">Divisions utilisées</div>
            </div>
        </div>

    </div>


    <!-- =========================
         FILTERS
    ========================= -->

    <div class="filters-card">

        <div class="filters">

            <div class="form-group">
                <label for="searchInput">
                    Recherche
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Code, nom, description..."
                    oninput="applyFilters()"
                >
            </div>


            <div class="form-group">

                <label for="divisionFilter">
                    Division
                </label>

                <select id="divisionFilter" onchange="applyFilters()">
                    <option value="">Toutes les divisions</option>
                </select>

            </div>


            <div class="form-group">

                <label for="statusFilter">
                    Statut
                </label>

                <select id="statusFilter" onchange="applyFilters()">
                    <option value="">Tous</option>
                    <option value="true">Actif</option>
                    <option value="false">Inactif</option>
                </select>

            </div>


            <button class="btn btn-secondary" onclick="resetFilters()">
                <i class="fa-solid fa-rotate-left"></i>
                Réinitialiser
            </button>

        </div>

    </div>


    <!-- =========================
         TABLE
    ========================= -->

    <div class="table-card">

        <div class="table-header">

            <h2>
                <i class="fa-solid fa-list"></i>
                Liste des magasins
            </h2>

            <button class="btn btn-secondary btn-sm"
                    onclick="loadData()">
                <i class="fa-solid fa-arrows-rotate"></i>
                Actualiser
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Nom</th>
                    <th>Division</th>
                    <th>Type</th>
                    <th>Emplacements</th>
                    <th>Max palettes</th>
                    <th>Max tonnage KG</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody id="tableBody">

                <tr>
                    <td colspan="10">

                        <div class="loading">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            Chargement...
                        </div>

                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =========================
     MODAL
========================= -->

<div class="modal-overlay" id="modalOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Nouveau magasin
            </h2>

            <button class="modal-close"
                    onclick="closeModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <form id="magasinForm"
              onsubmit="saveMagasin(event)">

            <div class="modal-body">

                <input type="hidden" id="magasinId">


                <div class="form-grid">

                    <!-- CODE -->

                    <div class="form-group">

                        <label for="code">
                            Code *
                        </label>

                        <input
                            type="text"
                            id="code"
                            required
                            maxlength="100"
                            placeholder="Ex: A407"
                        >

                    </div>


                    <!-- NOM -->

                    <div class="form-group">

                        <label for="name">
                            Nom *
                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                            maxlength="150"
                            placeholder="Ex: FAR"
                        >

                    </div>


                    <!-- DIVISION -->

                    <div class="form-group">

                        <label for="divisionId">
                            Division
                        </label>

                        <select id="divisionId">

                            <option value="">
                                -- Aucune division --
                            </option>

                        </select>

                    </div>


                    <!-- TYPE -->

                    <div class="form-group">

                        <label for="type">
                            Type
                        </label>

                        <input
                            type="text"
                            id="type"
                            maxlength="100"
                            placeholder="Ex: Chambre, magasin..."
                        >

                    </div>


                    <!-- MAX PALETTES -->

                    <div class="form-group">

                        <label for="maxPalettes">
                            Max palettes
                        </label>

                        <input
                            type="number"
                            id="maxPalettes"
                            min="0"
                            step="1"
                            value="0"
                        >

                    </div>


                    <!-- MAX TONNAGE -->

                    <div class="form-group">

                        <label for="maxTonnage">
                            Max tonnage KG
                        </label>

                        <input
                            type="number"
                            id="maxTonnage"
                            min="0"
                            step="0.001"
                            value="0"
                        >

                    </div>


                    <!-- HAS EMPLACEMENTS -->

                    <div class="form-group">

                        <label for="hasEmplacements">
                            Gestion des emplacements
                        </label>

                        <select id="hasEmplacements">

                            <option value="false">
                                Non
                            </option>

                            <option value="true">
                                Oui
                            </option>

                        </select>

                    </div>


                    <!-- STATUS -->

                    <div class="form-group">

                        <label for="isActive">
                            Statut
                        </label>

                        <select id="isActive">

                            <option value="true">
                                Actif
                            </option>

                            <option value="false">
                                Inactif
                            </option>

                        </select>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group full">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            rows="3"
                            placeholder="Description du magasin..."
                        ></textarea>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        onclick="closeModal()">

                    Annuler

                </button>

                <button type="submit"
                        class="btn btn-primary"
                        id="saveButton">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Enregistrer

                </button>

            </div>

        </form>

    </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div class="toast-container" id="toastContainer"></div>


<!-- =========================
     SUPABASE
========================= -->

<script src="api/supabase.js"></script>


<script>

    const db = window.smtgSupabase;

    let allMagasins = [];
    let allDivisions = [];
    let filteredMagasins = [];
    let currentUser = null;


    /* =====================================================
       INIT
    ===================================================== */

    document.addEventListener("DOMContentLoaded", async () => {

        try {

            currentUser = window.SMTG?.getCurrentUser
                ? window.SMTG.getCurrentUser()
                : null;

            await loadDivisions();
            await loadData();

        } catch (error) {

            console.error(error);

            showToast(
                "Erreur lors du chargement de la page.",
                "error"
            );

        }

    });


    /* =====================================================
       LOAD DIVISIONS
    ===================================================== */

    async function loadDivisions() {

        const { data, error } = await db
            .from("divisions")
            .select(`
                id,
                code,
                name,
                is_active
            `)
            .order("code", { ascending: true });

        if (error) {

            console.error(
                "Erreur loadDivisions:",
                error
            );

            throw error;
        }

        allDivisions = data || [];

        fillDivisionSelects();

    }


    /* =====================================================
       FILL DIVISION SELECTS
    ===================================================== */

    function fillDivisionSelects() {

        const filter = document.getElementById(
            "divisionFilter"
        );

        const select = document.getElementById(
            "divisionId"
        );


        filter.innerHTML =
            `<option value="">Toutes les divisions</option>`;


        select.innerHTML =
            `<option value="">-- Aucune division --</option>`;


        allDivisions.forEach(division => {

            const text =
                `${division.code} - ${division.name}`;


            if (division.is_active) {

                filter.innerHTML += `
                    <option value="${division.id}">
                        ${escapeHtml(text)}
                    </option>
                `;

            }


            select.innerHTML += `
                <option value="${division.id}">
                    ${escapeHtml(text)}
                </option>
            `;

        });

    }


    /* =====================================================
       LOAD MAGASINS
    ===================================================== */

    async function loadData() {

        showTableLoading();


        const { data, error } = await db
            .from("magasins")
            .select(`
                id,
                code,
                name,
                description,
                type,
                has_emplacements,
                max_palettes,
                max_tonnage_kg,
                is_active,
                division_id,
                created_by,
                created_at,
                updated_by,
                updated_at
            `)
            .order("code", { ascending: true });


        if (error) {

            console.error(
                "Erreur loadData:",
                error
            );

            showToast(
                "Impossible de charger les magasins.",
                "error"
            );

            return;
        }


        allMagasins = data || [];

        applyFilters();

        updateStats();

    }


    /* =====================================================
       FILTERS
    ===================================================== */

    function applyFilters() {

        const search =
            document.getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        const divisionId =
            document.getElementById("divisionFilter")
                .value;


        const status =
            document.getElementById("statusFilter")
                .value;


        filteredMagasins =
            allMagasins.filter(magasin => {

                let okSearch = true;
                let okDivision = true;
                let okStatus = true;


                if (search) {

                    const division =
                        getDivision(magasin.division_id);


                    const content = [
                        magasin.code,
                        magasin.name,
                        magasin.description,
                        magasin.type,
                        division?.code,
                        division?.name
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    okSearch =
                        content.includes(search);

                }


                if (divisionId) {

                    okDivision =
                        String(magasin.division_id)
                        === String(divisionId);

                }


                if (status !== "") {

                    okStatus =
                        String(magasin.is_active)
                        === status;

                }


                return (
                    okSearch &&
                    okDivision &&
                    okStatus
                );

            });


        renderTable();

    }


    function resetFilters() {

        document.getElementById(
            "searchInput"
        ).value = "";


        document.getElementById(
            "divisionFilter"
        ).value = "";


        document.getElementById(
            "statusFilter"
        ).value = "";


        applyFilters();

    }


    /* =====================================================
       RENDER TABLE
    ===================================================== */

    function renderTable() {

        const tbody =
            document.getElementById("tableBody");


        if (!filteredMagasins.length) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="10">

                        <div class="empty">

                            <i class="fa-solid fa-warehouse"></i>

                            <div>
                                Aucun magasin trouvé.
                            </div>

                        </div>

                    </td>
                </tr>
            `;

            return;
        }


        tbody.innerHTML =
            filteredMagasins.map(magasin => {

                const division =
                    getDivision(magasin.division_id);


                const statusClass =
                    magasin.is_active
                        ? "active"
                        : "inactive";


                const statusText =
                    magasin.is_active
                        ? "Actif"
                        : "Inactif";


                const hasEmplacements =
                    magasin.has_emplacements
                        ? "Oui"
                        : "Non";


                return `

                    <tr>

                        <td>
                            ${magasin.id}
                        </td>


                        <td>
                            <span class="code">
                                ${escapeHtml(
                                    magasin.code || ""
                                )}
                            </span>
                        </td>


                        <td>
                            ${escapeHtml(
                                magasin.name || ""
                            )}
                        </td>


                        <td>

                            ${
                                division

                                ? `
                                    <span class="division-badge">

                                        <i class="fa-solid fa-code-branch"></i>

                                        ${escapeHtml(
                                            division.code
                                        )}

                                        -
                                        ${escapeHtml(
                                            division.name
                                        )}

                                    </span>
                                `

                                : `
                                    <span class="no-division">
                                        Non affecté
                                    </span>
                                `
                            }

                        </td>


                        <td>
                            ${escapeHtml(
                                magasin.type || "-"
                            )}
                        </td>


                        <td>
                            ${hasEmplacements}
                        </td>


                        <td>
                            ${formatNumber(
                                magasin.max_palettes
                            )}
                        </td>


                        <td>
                            ${formatKg(
                                magasin.max_tonnage_kg
                            )}
                        </td>


                        <td>

                            <span class="status ${statusClass}">

                                <i class="fa-solid ${
                                    magasin.is_active
                                        ? "fa-check"
                                        : "fa-xmark"
                                }"></i>

                                ${statusText}

                            </span>

                        </td>


                        <td>

                            <div class="actions">

                                <button
                                    class="btn btn-warning btn-sm"
                                    onclick="openEditModal(${magasin.id})"
                                    title="Modifier"
                                >

                                    <i class="fa-solid fa-pen"></i>

                                </button>


                                <button
                                    class="btn btn-danger btn-sm"
                                    onclick="deleteMagasin(${magasin.id})"
                                    title="Supprimer"
                                >

                                    <i class="fa-solid fa-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    /* =====================================================
       STATS
    ===================================================== */

    function updateStats() {

        const total =
            allMagasins.length;


        const active =
            allMagasins.filter(
                m => m.is_active
            ).length;


        const inactive =
            allMagasins.filter(
                m => !m.is_active
            ).length;


        const divisions =
            new Set(
                allMagasins
                    .map(m => m.division_id)
                    .filter(Boolean)
            ).size;


        document.getElementById(
            "statTotal"
        ).textContent = total;


        document.getElementById(
            "statActive"
        ).textContent = active;


        document.getElementById(
            "statInactive"
        ).textContent = inactive;


        document.getElementById(
            "statDivisions"
        ).textContent = divisions;

    }


    /* =====================================================
       CREATE
    ===================================================== */

    function openCreateModal() {

        document.getElementById(
            "modalTitle"
        ).textContent = "Nouveau magasin";


        document.getElementById(
            "magasinForm"
        ).reset();


        document.getElementById(
            "magasinId"
        ).value = "";


        document.getElementById(
            "maxPalettes"
        ).value = 0;


        document.getElementById(
            "maxTonnage"
        ).value = 0;


        document.getElementById(
            "hasEmplacements"
        ).value = "false";


        document.getElementById(
            "isActive"
        ).value = "true";


        document.getElementById(
            "divisionId"
        ).value = "";


        document.getElementById(
            "modalOverlay"
        ).classList.add("show");


        setTimeout(() => {

            document.getElementById(
                "code"
            ).focus();

        }, 100);

    }


    /* =====================================================
       EDIT
    ===================================================== */

    function openEditModal(id) {

        const magasin =
            allMagasins.find(
                m => Number(m.id) === Number(id)
            );


        if (!magasin) {

            showToast(
                "Magasin introuvable.",
                "error"
            );

            return;
        }


        document.getElementById(
            "modalTitle"
        ).textContent =
            "Modifier le magasin";


        document.getElementById(
            "magasinId"
        ).value =
            magasin.id;


        document.getElementById(
            "code"
        ).value =
            magasin.code || "";


        document.getElementById(
            "name"
        ).value =
            magasin.name || "";


        document.getElementById(
            "divisionId"
        ).value =
            magasin.division_id ?? "";


        document.getElementById(
            "type"
        ).value =
            magasin.type || "";


        document.getElementById(
            "maxPalettes"
        ).value =
            magasin.max_palettes ?? 0;


        document.getElementById(
            "maxTonnage"
        ).value =
            magasin.max_tonnage_kg ?? 0;


        document.getElementById(
            "hasEmplacements"
        ).value =
            String(
                Boolean(magasin.has_emplacements)
            );


        document.getElementById(
            "isActive"
        ).value =
            String(
                Boolean(magasin.is_active)
            );


        document.getElementById(
            "description"
        ).value =
            magasin.description || "";


        document.getElementById(
            "modalOverlay"
        ).classList.add("show");

    }


    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    function closeModal() {

        document.getElementById(
            "modalOverlay"
        ).classList.remove("show");

    }


    /* =====================================================
       SAVE
    ===================================================== */

    async function saveMagasin(event) {

        event.preventDefault();


        const id =
            document.getElementById(
                "magasinId"
            ).value;


        const code =
            document.getElementById(
                "code"
            ).value
            .trim();


        const name =
            document.getElementById(
                "name"
            ).value
            .trim();


        const divisionValue =
            document.getElementById(
                "divisionId"
            ).value;


        const type =
            document.getElementById(
                "type"
            ).value
            .trim();


        const maxPalettes =
            Number(
                document.getElementById(
                    "maxPalettes"
                ).value || 0
            );


        const maxTonnage =
            Number(
                document.getElementById(
                    "maxTonnage"
                ).value || 0
            );


        const hasEmplacements =
            document.getElementById(
                "hasEmplacements"
            ).value === "true";


        const isActive =
            document.getElementById(
                "isActive"
            ).value === "true";


        const description =
            document.getElementById(
                "description"
            ).value
            .trim();


        if (!code || !name) {

            showToast(
                "Le code et le nom sont obligatoires.",
                "warning"
            );

            return;
        }


        if (maxPalettes < 0) {

            showToast(
                "Le nombre maximum de palettes ne peut pas être négatif.",
                "warning"
            );

            return;
        }


        if (maxTonnage < 0) {

            showToast(
                "Le tonnage maximum ne peut pas être négatif.",
                "warning"
            );

            return;
        }


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        saveButton.disabled = true;

        saveButton.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Enregistrement...
        `;


        try {

            const divisionId =
                divisionValue
                    ? Number(divisionValue)
                    : null;


            const payload = {

                code,
                name,
                description:
                    description || null,

                type:
                    type || null,

                has_emplacements:
                    hasEmplacements,

                max_palettes:
                    maxPalettes,

                max_tonnage_kg:
                    maxTonnage,

                is_active:
                    isActive,

                division_id:
                    divisionId

            };


            let result;


            /* =========================
               UPDATE
            ========================= */

            if (id) {

                payload.updated_by =
                    getCurrentUserId();


                result =
                    await db
                        .from("magasins")
                        .update(payload)
                        .eq("id", Number(id))
                        .select()
                        .single();


                if (result.error) {
                    throw result.error;
                }


                const updated =
                    result.data;


                await logCrud(
                    "UPDATE",
                    updated.id,
                    "Modification du magasin",
                    {
                        code:
                            updated.code,

                        name:
                            updated.name,

                        division_id:
                            updated.division_id
                    }
                );


                await logSystem(
                    "Modification magasin",
                    `Magasin ${updated.code} modifié`
                );


                showToast(
                    "Magasin modifié avec succès.",
                    "success"
                );

            }


            /* =========================
               INSERT
            ========================= */

            else {

                payload.created_by =
                    getCurrentUserId();


                payload.updated_by =
                    getCurrentUserId();


                result =
                    await db
                        .from("magasins")
                        .insert(payload)
                        .select()
                        .single();


                if (result.error) {
                    throw result.error;
                }


                const created =
                    result.data;


                await logCrud(
                    "CREATE",
                    created.id,
                    "Création du magasin",
                    {
                        code:
                            created.code,

                        name:
                            created.name,

                        division_id:
                            created.division_id
                    }
                );


                await logSystem(
                    "Création magasin",
                    `Magasin ${created.code} créé`
                );


                showToast(
                    "Magasin créé avec succès.",
                    "success"
                );

            }


            closeModal();

            await loadData();

        } catch (error) {

            console.error(
                "Erreur saveMagasin:",
                error
            );


            if (
                error?.code === "23505"
            ) {

                showToast(
                    "Ce code magasin existe déjà.",
                    "error"
                );

            } else {

                showToast(
                    error?.message ||
                    "Erreur lors de l'enregistrement.",
                    "error"
                );

            }

        } finally {

            saveButton.disabled = false;

            saveButton.innerHTML = `
                <i class="fa-solid fa-floppy-disk"></i>
                Enregistrer
            `;

        }

    }


    /* =====================================================
       DELETE
    ===================================================== */

    async function deleteMagasin(id) {

        const magasin =
            allMagasins.find(
                m => Number(m.id) === Number(id)
            );


        if (!magasin) {
            return;
        }


        const confirmed =
            confirm(
                `Voulez-vous vraiment supprimer le magasin "${magasin.code} - ${magasin.name}" ?`
            );


        if (!confirmed) {
            return;
        }


        try {

            const { error } =
                await db
                    .from("magasins")
                    .delete()
                    .eq("id", Number(id));


            if (error) {
                throw error;
            }


            await logCrud(
                "DELETE",
                magasin.id,
                "Suppression du magasin",
                {
                    code:
                        magasin.code,

                    name:
                        magasin.name,

                    division_id:
                        magasin.division_id
                }
            );


            await logSystem(
                "Suppression magasin",
                `Magasin ${magasin.code} supprimé`
            );


            showToast(
                "Magasin supprimé avec succès.",
                "success"
            );


            await loadData();

        } catch (error) {

            console.error(
                "Erreur deleteMagasin:",
                error
            );


            showToast(
                error?.message ||
                "Impossible de supprimer le magasin.",
                "error"
            );

        }

    }


    /* =====================================================
       HELPERS
    ===================================================== */

    function getDivision(divisionId) {

        if (
            divisionId === null ||
            divisionId === undefined
        ) {
            return null;
        }


        return allDivisions.find(
            d => Number(d.id) === Number(divisionId)
        ) || null;

    }


    function getCurrentUserId() {

        try {

            if (
                window.SMTG &&
                typeof window.SMTG.getCurrentUser === "function"
            ) {

                const user =
                    window.SMTG.getCurrentUser();


                if (user?.id) {
                    return Number(user.id);
                }

            }


            const raw =
                sessionStorage.getItem(
                    "smtg_current_user"
                );


            if (raw) {

                const user =
                    JSON.parse(raw);


                if (user?.id) {
                    return Number(user.id);
                }

            }

        } catch (error) {

            console.warn(
                "Impossible de récupérer l'utilisateur courant:",
                error
            );

        }


        /*
         * SYSTEM = 1 uniquement comme
         * valeur technique de secours.
         */

        return 1;

    }


    /* =====================================================
       LOG CRUD
    ===================================================== */

    async function logCrud(
        action,
        recordId,
        description,
        details
    ) {

        try {

            if (
                window.SMTG &&
                typeof window.SMTG.logCrudAction === "function"
            ) {

                await window.SMTG.logCrudAction(
                    action,
                    "ADMINISTRATION",
                    "MAGASINS",
                    recordId,
                    description,
                    details
                );

            }

        } catch (error) {

            console.warn(
                "Erreur journalisation CRUD:",
                error
            );

        }

    }


    /* =====================================================
       LOG SYSTEM
    ===================================================== */

    async function logSystem(
        action,
        message
    ) {

        try {

            if (
                window.SMTG &&
                typeof window.SMTG.logSystem === "function"
            ) {

                await window.SMTG.logSystem(
                    action,
                    message,
                    {
                        page: "magasins.html"
                    }
                );

            }

        } catch (error) {

            console.warn(
                "Erreur journalisation système:",
                error
            );

        }

    }


    /* =====================================================
       TABLE LOADING
    ===================================================== */

    function showTableLoading() {

        document.getElementById(
            "tableBody"
        ).innerHTML = `

            <tr>

                <td colspan="10">

                    <div class="loading">

                        <i class="fa-solid fa-spinner fa-spin"></i>

                        Chargement des magasins...

                    </div>

                </td>

            </tr>

        `;

    }


    /* =====================================================
       FORMAT
    ===================================================== */

    function formatNumber(value) {

        const number =
            Number(value || 0);


        return number.toLocaleString(
            "fr-FR",
            {
                maximumFractionDigits: 0
            }
        );

    }


    function formatKg(value) {

        const number =
            Number(value || 0);


        return number.toLocaleString(
            "fr-FR",
            {
                minimumFractionDigits: 3,
                maximumFractionDigits: 3
            }
        );

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(
        message,
        type = "success"
    ) {

        const container =
            document.getElementById(
                "toastContainer"
            );


        const toast =
            document.createElement("div");


        toast.className =
            `toast ${type}`;


        let icon =
            "fa-circle-check";


        if (type === "error") {
            icon = "fa-circle-xmark";
        }

        if (type === "warning") {
            icon = "fa-triangle-exclamation";
        }


        toast.innerHTML = `

            <i class="fa-solid ${icon}"></i>

            <span>
                ${escapeHtml(message)}
            </span>

        `;


        container.appendChild(toast);


        setTimeout(() => {

            toast.remove();

        }, 4000);

    }


    /* =====================================================
       CLOSE MODAL OUTSIDE
    ===================================================== */

    document.getElementById(
        "modalOverlay"
    ).addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );


    /* =====================================================
       ESCAPE KEY
    ===================================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeModal();

            }

        }
    );

</script>
