<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#075596"
    >

    <title>SMTG Abattoir - Connexion</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        body {

            background-color: #b8bec5;

            background-image:
                linear-gradient(
                    rgba(4, 24, 45, 0.18),
                    rgba(4, 24, 45, 0.18)
                ),
                url("./img/login-bg.png");

            background-position:
                center center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

            background-attachment:
                fixed;

            min-height:
                100vh;

            position:
                relative;
        }


        /* =====================================================
           LOGIN CONTAINER
        ===================================================== */

        .login-container {

            position:
                absolute;

            inset:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            z-index:
                10;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            width:
                400px;

            max-width:
                94vw;

            padding:
                30px 32px 25px;

            background:
                rgba(248, 251, 254, 0.96);

            border:
                1px solid
                rgba(255, 255, 255, 0.90);

            border-radius:
                18px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.30);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            position:
                relative;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-container {

            text-align:
                center;

            margin-bottom:
                18px;
        }


        .logo {

            width:
                175px;

            max-width:
                75%;

            height:
                auto;

            display:
                block;

            margin:
                0 auto;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .login-title {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            margin-top:
                12px;

            margin-bottom:
                22px;

            color:
                #365674;

            font-size:
                15px;

            font-weight:
                500;

            white-space:
                nowrap;
        }


        .login-title::before,
        .login-title::after {

            content:
                "";

            height:
                1px;

            background:
                #c9d5df;

            flex:
                1;
        }


        /* =====================================================
           INPUT GROUP
        ===================================================== */

        .input-group {

            width:
                100%;

            height:
                54px;

            display:
                flex;

            align-items:
                center;

            background:
                rgba(255, 255, 255, 0.95);

            border:
                1px solid
                #d1deea;

            border-radius:
                10px;

            overflow:
                hidden;

            margin-bottom:
                12px;

            transition:
                0.2s ease;
        }


        .input-group:focus-within {

            border-color:
                #1478cf;

            box-shadow:
                0 0 0 3px
                rgba(20, 120, 207, 0.10);
        }


        /* =====================================================
           INPUT ICON
        ===================================================== */

        .input-icon {

            width:
                48px;

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #075596;

            border-right:
                1px solid
                #e1e8ef;

            flex-shrink:
                0;
        }


        .input-icon svg {

            width:
                21px;

            height:
                21px;

            stroke:
                currentColor;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-group input {

            width:
                100%;

            height:
                100%;

            border:
                none;

            outline:
                none;

            background:
                transparent;

            padding:
                0 14px;

            font-size:
                14px;

            color:
                #244765;
        }


        .input-group input::placeholder {

            color:
                #8094a8;
        }


        /* =====================================================
           PASSWORD TOGGLE
        ===================================================== */

        .password-toggle {

            width:
                48px;

            height:
                100%;

            border:
                none;

            background:
                transparent;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            color:
                #56718a;

            flex-shrink:
                0;
        }


        .password-toggle:hover {

            color:
                #075596;
        }


        .password-toggle svg {

            width:
                20px;

            height:
                20px;

            stroke:
                currentColor;
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .options {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin:
                5px 2px 18px;

            font-size:
                11px;
        }


        .remember {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            color:
                #48647c;

            cursor:
                pointer;

            user-select:
                none;
        }


        .remember input {

            width:
                14px;

            height:
                14px;

            accent-color:
                #0877d1;

            cursor:
                pointer;
        }


        .forgot {

            color:
                #0877d1;

            text-decoration:
                none;

            cursor:
                pointer;
        }


        .forgot:hover {

            text-decoration:
                underline;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width:
                100%;

            height:
                54px;

            border:
                none;

            border-radius:
                10px;

            background:
                linear-gradient(
                    135deg,
                    #0878d1,
                    #0759a4
                );

            color:
                white;

            font-size:
                16px;

            font-weight:
                700;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                9px;

            cursor:
                pointer;

            box-shadow:
                0 7px 18px
                rgba(7, 91, 163, 0.25);

            transition:
                0.2s ease;
        }


        .login-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 22px
                rgba(7, 91, 163, 0.32);
        }


        .login-button:active {

            transform:
                translateY(0);
        }


        .login-button:disabled {

            opacity:
                0.65;

            cursor:
                wait;

            transform:
                none;
        }


        .login-button svg {

            width:
                20px;

            height:
                20px;

            stroke:
                currentColor;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            min-height:
                20px;

            margin-top:
                10px;

            text-align:
                center;

            font-size:
                11px;

            font-weight:
                600;

            opacity:
                0;

            transition:
                opacity 0.2s ease;
        }


        .message.show {

            opacity:
                1;
        }


        .message.error {

            color:
                #c62828;
        }


        .message.success {

            color:
                #218838;
        }


        .message.info {

            color:
                #27618f;
        }


        /* =====================================================
           CARD BOTTOM
        ===================================================== */

        .card-bottom {

            text-align:
                center;

            margin-top:
                16px;

            padding-top:
                13px;

            border-top:
                1px solid
                #e2e9ef;
        }


        .bottom-title {

            color:
                #315574;

            font-size:
                12px;

            font-weight:
                600;
        }


        .bottom-subtitle {

            margin-top:
                5px;

            color:
                #8092a2;

            font-size:
                8px;

            letter-spacing:
                2px;
        }


        /* =====================================================
           DATE / TIME
        ===================================================== */

        .date-time {

            position:
                fixed;

            left:
                18px;

            bottom:
                12px;

            color:
                white;

            font-size:
                11px;

            font-weight:
                500;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.60);

            z-index:
                20;
        }


        /* =====================================================
           VERSION
        ===================================================== */

        .version {

            position:
                fixed;

            right:
                18px;

            bottom:
                12px;

            color:
                white;

            font-size:
                10px;

            opacity:
                0.85;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.60);

            z-index:
                20;
        }


        /* =====================================================
           SPINNER
        ===================================================== */

        .spinner {

            width:
                18px;

            height:
                18px;

            border:
                2px solid
                rgba(255, 255, 255, 0.45);

            border-top-color:
                white;

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            .login-card {

                width:
                    360px;

                padding:
                    25px 23px 21px;
            }


            .logo {

                width:
                    155px;
            }


            .login-title {

                font-size:
                    13px;
            }


            .date-time {

                display:
                    none;
            }


            .version {

                right:
                    10px;

                bottom:
                    8px;
            }
        }


        /* =====================================================
           SMALL HEIGHT
        ===================================================== */

        @media (max-height: 650px) {

            .login-card {

                padding:
                    18px 25px 15px;
            }


            .logo {

                width:
                    125px;
            }


            .logo-container {

                margin-bottom:
                    10px;
            }


            .login-title {

                margin-top:
                    6px;

                margin-bottom:
                    12px;
            }


            .input-group {

                height:
                    47px;

                margin-bottom:
                    9px;
            }


            .options {

                margin-bottom:
                    12px;
            }


            .login-button {

                height:
                    47px;
            }


            .card-bottom {

                margin-top:
                    10px;

                padding-top:
                    8px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <main class="login-container">


        <section class="login-card">


            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="img/logo-smtg.png"
                    alt="SMTG Abattoir"
                    class="logo"
                >

            </div>


            <!-- TITLE -->

            <div class="login-title">

                <span>
                    Système de Gestion Intégré
                </span>

            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="input-group">


                    <div class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M20 21a8 8 0 0 0-16 0"
                            ></path>

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                            ></circle>

                        </svg>

                    </div>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nom d'utilisateur"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">


                    <div class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                        </svg>

                    </div>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mot de passe"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Afficher le mot de passe"
                    >

                        <svg
                            id="eyeIcon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M2 12s3.5-7 10-7
                                10 7 10 7-3.5 7-10 7
                                S2 12 2 12z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>


                <!-- OPTIONS -->

                <div class="options">


                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Se souvenir de moi
                        </span>

                    </label>


                    <a
                        href="#"
                        class="forgot"
                        id="forgotPassword"
                    >
                        Mot de passe oublié ?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <svg
                        id="loginIcon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M10 17l5-5-5-5"
                        ></path>

                        <path
                            d="M15 12H3"
                        ></path>

                        <path
                            d="M21 19V5a2 2 0 0 0-2-2h-6"
                        ></path>

                    </svg>


                    <span id="loginText">
                        Se connecter
                    </span>

                </button>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                ></div>


            </form>


            <!-- CARD BOTTOM -->

            <div class="card-bottom">

                <div class="bottom-title">
                    De la ferme à l'assiette
                </div>

                <div class="bottom-subtitle">
                    SÉCURITÉ • QUALITÉ • PERFORMANCE
                </div>

            </div>


        </section>

    </main>


    <!-- =====================================================
         DATE / TIME
    ====================================================== -->

    <div
        class="date-time"
        id="dateTime"
    >
        Chargement...
    </div>


    <!-- =====================================================
         VERSION
    ====================================================== -->

    <div class="version">
        v1.0.0
    </div>


    <!-- =====================================================
         SUPABASE JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         SUPABASE CONNECTION
    ====================================================== -->

    <script
        src="api/supabase.js"
    ></script>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById("loginForm");


        const usernameInput =
            document.getElementById("username");


        const passwordInput =
            document.getElementById("password");


        const rememberInput =
            document.getElementById("remember");


        const togglePassword =
            document.getElementById("togglePassword");


        const eyeIcon =
            document.getElementById("eyeIcon");


        const loginButton =
            document.getElementById("loginButton");


        const loginIcon =
            document.getElementById("loginIcon");


        const loginText =
            document.getElementById("loginText");


        const message =
            document.getElementById("message");


        const forgotPassword =
            document.getElementById("forgotPassword");


        const dateTime =
            document.getElementById("dateTime");


        /* =====================================================
           DATE / TIME
        ===================================================== */

        function updateDateTime() {

            const now =
                new Date();


            const date =
                now.toLocaleDateString(
                    "fr-FR",
                    {
                        weekday: "long",
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }
                );


            const time =
                now.toLocaleTimeString(
                    "fr-FR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            dateTime.textContent =
                date.charAt(0).toUpperCase() +
                date.slice(1) +
                " | " +
                time;
        }


        updateDateTime();


        setInterval(
            updateDateTime,
            1000
        );


        /* =====================================================
           SHOW / HIDE PASSWORD
        ===================================================== */

        togglePassword.addEventListener(
            "click",
            function () {

                const isPassword =
                    passwordInput.type === "password";


                if (isPassword) {

                    passwordInput.type =
                        "text";


                    eyeIcon.innerHTML = `

                        <path d="M3 3l18 18"></path>

                        <path
                            d="M10.58 10.58
                            A2 2 0 0 0
                            13.42 13.42"
                        ></path>

                        <path
                            d="M9.88 4.24
                            A10.94 10.94 0 0 1
                            12 4
                            c7 0 10 8 10 8
                            a18.3 18.3 0 0 1
                            -3.12 4.19"
                        ></path>

                        <path
                            d="M6.61 6.61
                            A18.3 18.3 0 0 0
                            2 12
                            s3 8 10 8
                            a10.94 10.94 0 0 0
                            5.24-1.35"
                        ></path>

                    `;

                } else {

                    passwordInput.type =
                        "password";


                    eyeIcon.innerHTML = `

                        <path
                            d="M2 12s3.5-7 10-7
                            10 7 10 7-3.5 7-10 7
                            S2 12 2 12z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    `;
                }

            }
        );


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message show " + type;
        }


        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "message";
        }


        /* =====================================================
           REMEMBER USERNAME
        ===================================================== */

        const savedUsername =
            localStorage.getItem(
                "smtg_remember_username"
            );


        if (savedUsername) {

            usernameInput.value =
                savedUsername;

            rememberInput.checked =
                true;
        }


        /* =====================================================
           FORGOT PASSWORD
        ===================================================== */

        forgotPassword.addEventListener(
            "click",
            function (event) {

                event.preventDefault();


                showMessage(
                    "Veuillez contacter l'administrateur système.",
                    "info"
                );

            }
        );


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                clearMessage();


                const username =
                    usernameInput.value.trim();


                const password =
                    passwordInput.value;


                /* =================================================
                   VALIDATION
                ================================================= */

                if (
                    !username ||
                    !password
                ) {

                    showMessage(
                        "Veuillez saisir votre nom d'utilisateur et votre mot de passe.",
                        "error"
                    );

                    return;
                }


                /* =================================================
                   LOADING
                ================================================= */

                loginButton.disabled =
                    true;


                loginText.textContent =
                    "Connexion...";


                loginIcon.style.display =
                    "none";


                const spinner =
                    document.createElement("span");


                spinner.className =
                    "spinner";


                loginButton.insertBefore(
                    spinner,
                    loginText
                );


                try {


                    /* =================================================
                       SUPABASE CLIENT
                    ================================================= */

                    const client =
                        getSupabase();


                    /* =================================================
                       SEARCH USER
                    ================================================= */

                    const {
                        data,
                        error
                    } = await client
                        .from("users")
                        .select(`
                            id,
                            username,
                            full_name,
                            password,
                            role_id,
                            is_active,
                            is_system
                        `)
                        .eq(
                            "username",
                            username
                        )
                        .eq(
                            "is_active",
                            true
                        )
                        .eq(
                            "is_system",
                            false
                        )
                        .maybeSingle();


                    /* =================================================
                       DATABASE ERROR
                    ================================================= */

                    if (error) {

                        console.error(
                            "Supabase:",
                            error
                        );

                        throw error;
                    }


                    /* =================================================
                       USER NOT FOUND
                    ================================================= */

                    if (!data) {

                        showMessage(
                            "Nom d'utilisateur ou mot de passe incorrect.",
                            "error"
                        );

                        return;
                    }


                    /* =================================================
                       PASSWORD
                       
                       TEMPORAIRE
                    ================================================= */

                    if (
                        data.password !==
                        password
                    ) {

                        showMessage(
                            "Nom d'utilisateur ou mot de passe incorrect.",
                            "error"
                        );

                        return;
                    }


                    /* =================================================
                       REMEMBER USERNAME
                    ================================================= */

                    if (
                        rememberInput.checked
                    ) {

                        localStorage.setItem(
                            "smtg_remember_username",
                            username
                        );

                    } else {

                        localStorage.removeItem(
                            "smtg_remember_username"
                        );
                    }


                    /* =================================================
                       SESSION
                    ================================================= */

                    const sessionUser = {

                        id:
                            data.id,

                        username:
                            data.username,

                        full_name:
                            data.full_name,

                        role_id:
                            data.role_id,

                        login_at:
                            new Date()
                                .toISOString()
                    };


                    sessionStorage.setItem(
                        "smtg_current_user",
                        JSON.stringify(
                            sessionUser
                        )
                    );


                    /* =================================================
                       SUCCESS
                    ================================================= */

                    showMessage(
                        "Connexion réussie.",
                        "success"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        600
                    );


                } catch (error) {


                    console.error(
                        "Erreur Login :",
                        error
                    );


                    showMessage(
                        "Erreur de connexion à la base de données.",
                        "error"
                    );


                } finally {


                    loginButton.disabled =
                        false;


                    loginText.textContent =
                        "Se connecter";


                    loginIcon.style.display =
                        "block";


                    if (spinner) {

                        spinner.remove();
                    }

                }

            }
        );


        /* =====================================================
           AUTO FOCUS
        ===================================================== */

        if (
            usernameInput.value
        ) {

            passwordInput.focus();

        } else {

            usernameInput.focus();
        }


    </script>

</body>

</html>
